<section class="admin-login">

    <div class="login-card">

        <h1>Admin belépés</h1>

        <div class="form-group">

            <label>
                Felhasználónév
            </label>

            <input
                type="text"
                (input)="username.set($any($event.target).value)">

        </div>

        <div class="form-group">

            <label>
                Jelszó
            </label>

            <input
                type="password"
                (input)="password.set($any($event.target).value)"
                (keyup.enter)="login()">

        </div>

        @if(errorMessage()) {

            <p class="error">
                {{ errorMessage() }}
            </p>

        }

        <button
            type="button"
            [disabled]="loading()"
            (click)="login()">

            @if(!loading()) {
                Bejelentkezés
            }

            @if(loading()) {
                Bejelentkezés...
            }

        </button>

    </div>

</section>
